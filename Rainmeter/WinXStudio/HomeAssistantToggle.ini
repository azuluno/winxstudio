[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=WinX Studio Home Assistant Toggle
Author=WinX Studio
Version=1.0
Information=Home Assistant entity toggle with live state display.
License=MIT

[Variables]
; Connection. Do not publish a real token.
HAUrl=http://homeassistant.local:8123
HAToken=PASTE_YOUR_LONG_LIVED_ACCESS_TOKEN_HERE

; Widget identity. Change these values for every widget.
HAEntity=light.living_room
HADomain=light
HAService=toggle
HAStatePath=/api/states/#HAEntity#
HAUpdateInterval=10

; Display
WidgetTitle=Living Room Light
; Material Symbols ligature names are not reliable in Rainmeter String meters.
; This is the Material Symbols lightbulb glyph (U+E518).
WidgetIcon=
WidgetX=20
WidgetY=20
WidgetWidth=260
WidgetHeight=92
OnColor=18,167,149,255
OffColor=105,120,124,255
TextColor=235,245,242,255
BackgroundColor=16,37,43,255

[MeasureHAState]
Measure=WebParser
URL=#HAUrl##HAStatePath#
Header=Authorization: Bearer #HAToken#
RegExp=(?si)"state"\s*:\s*"([^"]+)"
StringIndex=1
UpdateRate=#HAUpdateInterval#
DynamicVariables=1
IfMatch=on
IfMatchAction=[!SetOption MeterIcon FontColor "#OnColor#"][!SetOption MeterState FontColor "#OnColor#"][!UpdateMeter MeterIcon][!UpdateMeter MeterState][!Redraw]
IfNotMatchAction=[!SetOption MeterIcon FontColor "#OffColor#"][!SetOption MeterState FontColor "#TextColor#"][!UpdateMeter MeterIcon][!UpdateMeter MeterState][!Redraw]

[MeasureHAStateError]
Measure=Calc
Formula=MeasureHAState
IfCondition=(MeasureHAState = -1)
IfTrueAction=[!SetOption MeterState Text "Unavailable"][!UpdateMeter MeterState][!Redraw]
DynamicVariables=1

[MeasureToggle]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#CURRENTPATH#HomeAssistantService.ps1" -Url "#HAUrl#" -Token "#HAToken#" -Domain "#HADomain#" -Service "#HAService#" -EntityId "#HAEntity#"
State=Hide
ShowWindow=0
Timeout=10000
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureHAState][!UpdateMeter *][!Redraw]

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,12 | Fill Color #BackgroundColor# | StrokeWidth 2 | Stroke Color 55,82,84,255
X=#WidgetX#
Y=#WidgetY#
DynamicVariables=1

[MeterIcon]
Meter=String
Text=#WidgetIcon#
FontFace=Material Symbols Outlined
FontSize=28
FontColor=#OffColor#
X=(#WidgetX#+18)
Y=(#WidgetY#+30)
AntiAlias=1
DynamicVariables=1

[MeterTitle]
Meter=String
Text=#WidgetTitle#
FontFace=Segoe UI
FontSize=13
FontWeight=700
FontColor=#TextColor#
X=(#WidgetX#+62)
Y=(#WidgetY#+16)
AntiAlias=1
DynamicVariables=1

[MeterState]
Meter=String
MeasureName=MeasureHAState
Text=%1
FontFace=Segoe UI
FontSize=18
FontWeight=700
FontColor=#TextColor#
StringAlign=Right
X=(#WidgetX#+#WidgetWidth#-18)
Y=(#WidgetY#+58)
AntiAlias=1
DynamicVariables=1

[MeterEntity]
Meter=String
Text=#HADomain#  •  #HAEntity#
FontFace=Consolas
FontSize=9
FontColor=150,170,170,255
X=(#WidgetX#+62)
Y=(#WidgetY#+67)
AntiAlias=1
DynamicVariables=1

[MeterClickTarget]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,12 | Fill Color 0,0,0,1 | StrokeWidth 0
X=#WidgetX#
Y=#WidgetY#
LeftMouseUpAction=[!CommandMeasure MeasureToggle Run][!UpdateMeasure MeasureHAState][!UpdateMeter *][!Redraw]
DynamicVariables=1

; To use another entity, change all three identity variables above:
; HAEntity=light.kitchen
; HADomain=light
; HAService=toggle
; For a switch, use HADomain=switch and HAEntity=switch.example.
